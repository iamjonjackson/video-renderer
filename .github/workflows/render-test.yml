name: Render test

on:
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        spec: [sample-spec, le-chonk-spec]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          pip install moviepy matplotlib imageio-ffmpeg pillow python-pptx

      - name: Render ${{ matrix.spec }}
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python3 src/render.py samples/${{ matrix.spec }}.json -o output/${{ matrix.spec }}.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ matrix.spec }}
          path: |
            output/${{ matrix.spec }}.mp4
            output/${{ matrix.spec }}.pptx
          retention-days: 14
