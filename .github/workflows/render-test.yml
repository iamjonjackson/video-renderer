name: Render test

on:
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          ffmpeg -version | head -1 || true
          pip install moviepy matplotlib imageio-ffmpeg pillow

      - name: Render sample (with voiceover if secret present)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          python3 src/render.py samples/sample-spec.json -o output/sample.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-sample
          path: output/sample.mp4
          retention-days: 14
