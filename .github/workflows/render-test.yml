name: Render test

on:
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install moviepy matplotlib imageio-ffmpeg

      - name: Render sample (with voiceover if secret present)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          IMAGE_DEBUG: "1"
        run: |
          python3 src/render.py samples/sample-spec.json -o output/sample.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-sample
          path: output/sample.mp4
          retention-days: 14
